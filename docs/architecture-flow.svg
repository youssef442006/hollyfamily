<text x="740" y="376" font-size="20" fill="#78350f" text-anchor="middle" font-weight="800" font-family="'Segoe UI', Tahoma">الخادم الخلفي — FastAPI (uvicorn · المنفذ 8000 · async SQLAlchemy)</text>
<text x="740" y="406" font-size="14.5" fill="#92400e" text-anchor="middle" font-weight="700" font-family="'Segoe UI', Tahoma">طبقة الحماية (middleware + dependencies) — تُحقن في كل مسار:</text>
<text x="740" y="426" font-size="13.5" fill="#78350f" text-anchor="middle" font-weight="400" font-family="'Segoe UI', Tahoma">▸ Rate Limiter على login — 5 محاولات فاشلة خلال 5 دقائق = قفل 5 دقائق → 429</text>
<text x="740" y="456" font-size="13.5" fill="#78350f" text-anchor="middle" font-weight="400" font-family="'Segoe UI', Tahoma">▸ create_access_token → JWT (sub=user.id, role) · من SECRET_KEY المرفوض إذا لم يتغير (أمان!)</text>
<text x="740" y="486" font-size="13.5" fill="#78350f" text-anchor="middle" font-weight="400" font-family="'Segoe UI', Tahoma">▸ get_current_user ← Cookie access_token أو Bearer → يحل user + is_active</text>
<text x="740" y="516" font-size="13.5" fill="#78350f" text-anchor="middle" font-weight="400" font-family="'Segoe UI', Tahoma">▸ require_admin_role (admin فقط) · require_editor_role/editor (admin+priest+editor)</text>
<text x="740" y="546" font-size="13.5" fill="#78350f" text-anchor="middle" font-weight="400" font-family="'Segoe UI', Tahoma">▸ require_servant_crew (خدام/خدامات) · require_moderator (حذف)</text>
<text x="740" y="576" font-size="13.5" fill="#78350f" text-anchor="middle" font-weight="400" font-family="'Segoe UI', Tahoma">▸ AuditLog — تسجيل كل تغيير (user_id, action, table_name, old/new_value) للـ admin فقط</text>
