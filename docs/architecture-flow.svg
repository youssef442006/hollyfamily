<text x="740" y="156" font-size="13" fill="#075985" text-anchor="middle" font-weight="400" font-family="'Segoe UI', Tahoma">src/app/** : dashboard · persons · persons/[id]/tree · persons/[id]/family-history · families · families/[id]/tree · families/new</text>
